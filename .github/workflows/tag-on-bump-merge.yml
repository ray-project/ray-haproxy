name: Tag on bump PR merge

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  tag:
    name: Create v<version> tag and dispatch release
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'bump-haproxy-')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Extract version from branch name
        id: version
        run: |
          branch="${{ github.event.pull_request.head.ref }}"
          version="${branch#bump-haproxy-}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Branch name '$branch' did not yield a valid version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Verify tag does not already exist
        run: |
          if git rev-parse "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "Tag ${{ steps.version.outputs.tag }} already exists — nothing to do"
            exit 0
          fi

      - name: Create and push tag
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" \
            -m "HAProxy ${{ steps.version.outputs.version }} (auto-tagged from #${{ github.event.pull_request.number }})"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Dispatch release.yml on the new tag
        # Tag pushes made with GITHUB_TOKEN do not trigger other workflows,
        # so kick off release.yml explicitly via workflow_dispatch.
        run: |
          gh workflow run release.yml \
            --ref "${{ steps.version.outputs.tag }}" \
            -f haproxy_version="${{ steps.version.outputs.version }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
